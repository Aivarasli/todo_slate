name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Folder storage (Rust, std only)
        run: rustc --edition 2021 --test src-tauri/src/sync.rs -o sync_tests && ./sync_tests

  build-macos:
    name: Build macOS app
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm install
      - name: Build universal .dmg (Apple silicon and Intel)
        run: npx tauri build --target universal-apple-darwin
      - name: Keep the lockfile Cargo resolved
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: src-tauri/Cargo.lock
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: slate-tasks-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
